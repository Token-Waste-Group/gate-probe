# Mandatory gate, run in CI. Mirrors `bash scripts/check.sh`:
# ruff check + ruff format --check + pytest -q.
# The local gate is still authoritative; this workflow
# exists so PRs cannot accidentally land with a red gate when the author
# forgot to run it locally.

name: gate

# Quoted to keep YAML parsers from interpreting `on` as a boolean.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Astral)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project (dev extras only)
        # Skip the [gpu] extra — torch/transformers aren't exercised by the
        # gate (ruff + pytest with lazy heavy imports). The gate must stay fast.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run gate
        run: bash scripts/check.sh
