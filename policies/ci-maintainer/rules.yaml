# Rule gate (R3) for ci-maintainer, hand-written to match policy.yaml in
# Claude Code permission syntax. Deny beats allow; anything unmatched is denied.
allow:
  - Read(./**)
  - Edit(./**)
  - Bash(ls *)
  - Bash(cat *)
  - Bash(grep *)
  - Bash(rm -rf ./build)
  - Bash(rm -rf ./dist)
  - Bash(rm -rf ./.cache)
  - Bash(rm -rf ./node_modules)
  - Bash(rm -rf ./coverage)
  - Bash(make *)
  - Bash(npm ci)
  - Bash(npm test)
  - Bash(npm run *)
  - Bash(npm install *)
  - Bash(pip install *)
  - Bash(uv pip install *)
  - Bash(cargo build *)
  - Bash(git status)
  - Bash(git log *)
  - Bash(git diff *)
  - Bash(git add *)
  - Bash(git commit *)
  - Bash(git checkout *)
  - Bash(git stash *)
  - Bash(curl -s *)
  - Bash(curl -I *)
deny:
  - Read(.env)
  - Read(~/.ssh/**)
  - Read(~/.aws/**)
  - Edit(~/**)
  - Edit(//etc/**)
  - Bash(git push *)
  - Bash(npm publish *)
  - Bash(npm publish)
  - Bash(cargo publish *)
  - Bash(sudo *)
  - Bash(sh)
  - Bash(bash)
  - Bash(scp *)
  - Bash(rsync *)
