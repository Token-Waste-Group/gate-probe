# Rule gate (R3) for release-manager, hand-written to match policy.yaml in
# Claude Code permission syntax. Deny beats allow; anything unmatched is denied.
allow:
  - Read(./**)
  - Bash(ls *)
  - Bash(cat *)
  - Bash(make *)
  - Bash(npm test)
  - Bash(npm run *)
  - Bash(cargo build *)
  - Bash(git status)
  - Bash(git log *)
  - Bash(git diff *)
  - Bash(git show *)
  - Bash(git add *)
  - Bash(git commit *)
  - Bash(git checkout *)
  - Bash(git tag *)
  - Bash(git push origin *)
  - Bash(git push -u origin *)
  - Bash(npm publish *)
  - Bash(npm publish)
  - Bash(cargo publish *)
  - Bash(curl -s *)
  - Bash(curl -I *)
deny:
  - Read(.env)
  - Read(~/.ssh/**)
  - Read(~/.aws/**)
  - Bash(git push --force *)
  - Bash(git push -f *)
  - Bash(git push --mirror *)
  - Bash(git push origin --delete *)
  - Bash(git branch -D *)
  - Bash(git reset --hard *)
  - Bash(sudo *)
  - Bash(scp *)
  - Bash(rsync *)
  - Bash(rm -rf ~*)
  - Bash(rm -rf /*)
