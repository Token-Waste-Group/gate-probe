policy: workspace-dev
title: Workspace developer
description: The agent develops inside the project workspace and keeps everything local.
semantics: Anything not allowed is denied, and a deny rule always overrides an allow rule.
rules:
- effect: allow
  action: read
  scope: workspace
- effect: allow
  action: write
  scope: workspace
- effect: allow
  action: delete
  scope: build_outputs
- effect: allow
  action: run
  scope: workspace
- effect: allow
  action: git_read
  scope: workspace
- effect: allow
  action: git_local
  scope: workspace
- effect: allow
  action: install
  scope: registries
- effect: allow
  action: net_read
  scope: anywhere
- effect: deny
  action: read
  scope: secrets
- effect: deny
  action: write
  scope: outside_workspace
- effect: deny
  action: delete
  scope: outside_workspace
- effect: deny
  action: git_push
  scope: anywhere
- effect: deny
  action: net_send
  scope: anywhere
- effect: deny
  action: exec_remote
  scope: anywhere
- effect: deny
  action: sudo
  scope: anywhere
definitions:
  actions:
    delete: delete files
    exec_remote: execute code downloaded from the network
    git_local: make local git changes (add, commit, branch, stash, rebase, tag)
    git_push: push branches and tags
    git_read: inspect git status, history and diffs
    install: install or remove packages
    net_read: make read-only network requests
    net_send: send files or data over the network
    read: read files
    run: run builds, tests and project scripts
    sudo: run commands with sudo or change system packages
    write: create or modify files
  scopes:
    anywhere: anywhere
    build_outputs: in build outputs and caches (./build, ./dist, ./.cache, ./node_modules, ./coverage)
    outside_workspace: outside the project workspace (the home directory and system paths)
    registries: through public package registries
    secrets: that hold secrets (.env files, ~/.ssh, ~/.aws and other credentials)
    workspace: inside the project workspace
