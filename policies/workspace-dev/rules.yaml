# Rule gate (R3) for workspace-dev, hand-written to match policy.yaml in
# Claude Code permission syntax. Deny beats allow; anything unmatched is denied.
allow:
  - Read(./**)
  - Edit(./**)
  - Bash(ls *)
  - Bash(cat *)
  - Bash(grep *)
  - Bash(rm -rf ./build)
  - Bash(rm -rf ./dist)
  - Bash(rm -rf ./.cache)
  - Bash(rm -rf ./node_modules)
  - Bash(rm -rf ./coverage)
  - Bash(find ./build *)
  - Bash(make *)
  - Bash(npm ci)
  - Bash(npm test)
  - Bash(npm run *)
  - Bash(npm install *)
  - Bash(pip install *)
  - Bash(pip uninstall *)
  - Bash(uv pip install *)
  - Bash(cargo build *)
  - Bash(git status)
  - Bash(git log *)
  - Bash(git diff *)
  - Bash(git show *)
  - Bash(git branch *)
  - Bash(git add *)
  - Bash(git commit *)
  - Bash(git checkout *)
  - Bash(git stash *)
  - Bash(git rebase *)
  - Bash(git tag *)
  - Bash(curl -s *)
  - Bash(curl -I *)
  - Bash(wget -qO- *)
  - WebFetch(domain:docs.example.com)
deny:
  - Read(.env)
  - Read(~/.ssh/**)
  - Read(~/.aws/**)
  - Edit(~/**)
  - Edit(//etc/**)
  - Bash(rm -rf ~*)
  - Bash(rm -rf /*)
  - Bash(git push *)
  - Bash(sudo *)
  - Bash(sh)
  - Bash(bash)
  - Bash(scp *)
  - Bash(rsync *)
  - Bash(curl -X POST *)
  - Bash(curl -F *)
  - Bash(curl -T *)
  - Bash(npm install -g *)
  - Bash(pip install git+*)
