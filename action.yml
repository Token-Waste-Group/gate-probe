# GateProbe CI check as a composite GitHub Action (I3).
# Fails the job when, for some gate and relation class, the flip rate above the
# test-retest floor is significantly positive (95% lower bound > 0) and its
# estimate exceeds max-flip. Runs on recorded run files, so it needs no API key.
name: GateProbe flip check
description: Fail when a permission gate's metamorphic flip rate above its noise floor exceeds a threshold.
inputs:
  runs:
    description: Space-separated paths (or globs) of gateprobe run JSONL files.
    required: true
  max-flip:
    description: Largest tolerated flip rate above the floor.
    default: "0.05"
  classes:
    description: Comma-separated relation classes to check (E, M, I, A, P); empty for all.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: gateprobe ci --runs ${{ inputs.runs }} --max-flip "${{ inputs.max-flip }}" --classes "${{ inputs.classes }}"
