[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gateprobe"
version = "0.0.1"
description = "Metamorphic testing harness for coding-agent permission gates (ICSE 2027 Tool Demo)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
gateprobe = "gateprobe.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]
# The Claude judge (gates/claude.py, runner/batch.py); imported lazily, so the gate never needs it.
claude = [
    "anthropic>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gateprobe"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings: splitting markup across string fragments hurts more than long lines.
"src/gateprobe/report/html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
